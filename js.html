<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f0f2f5;
        }

        .calculator {
            background: #22252d;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 320px;
        }

        .display {
            width: 100%;
            height: 70px;
            background: #292d36;
            color: #ffffff;
            font-size: 2rem;
            text-align: right;
            padding: 15px;
            border: none;
            border-radius: 10px;
            margin-bottom: 20px;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 20px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #292d36;
            color: #ffffff;
            transition: background 0.2s;
        }

        button:hover {
            background: #383e4a;
        }

        button.operator {
            background: #4b5fc7;
            color: #fff;
        }

        button.operator:hover {
            background: #3b4eb3;
        }

        button.clear {
            background: #eb5757;
            color: #fff;
        }

        button.clear:hover {
            background: #d44343;
        }

        button.equal {
            background: #27ae60;
            color: #fff;
        }

        button.equal:hover {
            background: #219653;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" class="display" id="display" readonly>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="appendValue('/')" class="operator">&divide;</button>
            <button onclick="appendValue('*')" class="operator">&times;</button>
            <button onclick="deleteLast()" class="operator">&larr;</button>
            
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('-')" class="operator">-</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('+')" class="operator">+</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="equal" onclick="calculate()" style="grid-row: span 2; height: 100%;">=</button>
            
            <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
            <button onclick="appendValue('.')">.</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        function appendValue(value) {
            display.value += value;
        }

        function clearDisplay() {
            display.value = '';
        }

        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        function calculate() {
            try {
                // Using JavaScript's eval safely for basic arithmetic
                display.value = eval(display.value.replace('&times;', '*').replace('&divide;', '/'));
            } catch (error) {
                display.value = 'Error';
            }
        }
    </script>

</body>
</html>
